name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add local bin to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build distribution bundles (vp pack)
        run: vp pack

      - name: Stage GitHub Pages directory (_site)
        run: |
          rm -rf _site
          mkdir -p _site/dist _site/site _site/examples
          cp -R site/. _site/
          cp -R site/. _site/site/
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("_site/index.html", "utf8");
            fs.writeFileSync("_site/index.html", html.replace("../dist/naka.js", "./dist/naka.js"));
          '
          cp dist/naka.js dist/naka.min.js _site/dist/
          cp -R examples/. _site/examples/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
