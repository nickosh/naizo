name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag (must match package.json and belong to main)'
        required: true
        type: string
        default: v0.1.0
      publish_npm:
        description: 'Publish through npm Trusted Publishing (disable for the local first-publish bootstrap)'
        required: true
        type: boolean
        default: true
      expected_sha:
        description: 'Expected full tag commit SHA (automatically supplied by release preparation)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  build:
    name: Verify tagged source and pack once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pinned Vite+ environment without dependencies
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: false
          run-install: false

      - name: Validate and select exact tagged source
        id: source
        run: |
          vp node scripts/release.ts tag "$RELEASE_TAG"
          COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          WORKFLOW_COMMIT=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          vp node scripts/release.ts source "$COMMIT" "$WORKFLOW_COMMIT" "$EXPECTED_SHA"
          git merge-base --is-ancestor "$COMMIT" origin/main
          git checkout --detach "$COMMIT"
          vp node scripts/release.ts version "$RELEASE_TAG"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Confirm local bootstrap when npm publishing is disabled
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_npm
        run: vp node scripts/release.ts bootstrap "$RELEASE_TAG"

      - name: Install locked dependencies without a release cache
        run: vp install --frozen-lockfile

      - name: Verify isolated release tooling
        run: |
          vp env exec -- npm ci --prefix .github/release-tools --ignore-scripts --no-audit --no-fund
          vp node --test .github/release-tools/test.cjs

      - name: Verify and build distribution
        run: |
          vp check
          vp test
          vp pack
          node --check dist/naka.js
          node --check dist/naka.min.js
          git diff --exit-code dist/naka.js

      - name: Pack and validate exact publishable files
        run: |
          mkdir release-assets
          npm pack --ignore-scripts --json --pack-destination release-assets > release-assets/pack.json
          vp node scripts/release.ts package release-assets/pack.json
          cp dist/naka.js dist/naka.min.js release-assets/
          vp node scripts/release.ts artifacts release-assets

      - name: Upload verified release artifacts
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact tarball with npm OIDC
    needs: build
    if: github.event_name == 'release' || inputs.publish_npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified commit for release guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure an OIDC-capable npm CLI
        run: npm install --global npm@11 --ignore-scripts

      - name: Download verified artifacts from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true

      - name: Publish or verify an identical existing version
        run: |
          node scripts/release.ts package release-assets/pack.json
          TARBALL=$(node scripts/release.ts artifacts release-assets)
          STATUS=$(node scripts/release.ts status release-assets/pack.json)
          if [ "$STATUS" = identical ]; then
            echo "The identical package is already on npm; skipping publish."
          else
            npm publish "./release-assets/$TARBALL" --access public --provenance --ignore-scripts
          fi

  github-release:
    name: Attach verified assets to GitHub Release
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout verified commit for release guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Setup pinned Node without project dependencies
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download verified artifacts from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true

      - name: Verify assets and publish GitHub draft preserving its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.build.outputs.commit }}
        run: |
          node scripts/release.ts package release-assets/pack.json
          node .github/release-tools/github.cjs
