name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version target (use "current" for initial v0.1.0 or when package.json is already bumped)'
        required: true
        type: choice
        default: current
        options:
          - current
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Explicit semver (e.g. 0.1.0 or 0.2.0) when bump is "custom"'
        required: false
        type: string
      publish_npm:
        description: 'Publish package to npm (populates jsDelivr and unpkg)'
        required: true
        type: boolean
        default: true
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify, Tag, GitHub Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add local bin to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run verification suite (vp check, vp test, vp pack)
        run: |
          vp check
          vp test
          vp pack
          node --check dist/naka.js
          node --check dist/naka.min.js
          git diff --exit-code dist/naka.js

      - name: Resolve version and create GitHub Release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: cut_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_CUSTOM: ${{ inputs.custom_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [ "$INPUT_BUMP" = "current" ]; then
            TARGET_VERSION="$CURRENT_VERSION"
          elif [ "$INPUT_BUMP" = "custom" ]; then
            if [ -z "$INPUT_CUSTOM" ]; then
              echo "::error::custom_version input is required when bump is 'custom'"
              exit 1
            fi
            TARGET_VERSION="${INPUT_CUSTOM#v}"
            if [ "$TARGET_VERSION" != "$CURRENT_VERSION" ]; then
              npm version "$TARGET_VERSION" --no-git-tag-version
            fi
          else
            npm version "$INPUT_BUMP" --no-git-tag-version
            TARGET_VERSION=$(node -p "require('./package.json').version")
          fi

          if ! git diff --quiet package.json; then
            vp pack
            git add package.json dist/naka.js
            git commit -m "chore(release): v${TARGET_VERSION}" -m "Bump package version to ${TARGET_VERSION} for release."
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          TAG="v${TARGET_VERSION}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/naka.js dist/naka.min.js --clobber
          else
            gh release create "$TAG" dist/naka.js dist/naka.min.js \
              --title "$TAG" \
              --generate-notes
          fi

          echo "version=${TARGET_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Attach dist/naka.js and dist/naka.min.js on manual GitHub Release publish
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/naka.js dist/naka.min.js --clobber

      - name: Publish to npm (populates jsDelivr and unpkg)
        if: ${{ github.event_name == 'release' || inputs.publish_npm }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set; skipping npm publish. GitHub Release and gh CDN tags are live."
            exit 0
          fi
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published on npm; skipping."
            exit 0
          fi
          npm publish --access public --provenance
