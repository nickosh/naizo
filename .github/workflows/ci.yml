name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run midway through its GitHub Pages deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (check, test, pack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Vite+ environment
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify isolated release tooling
        run: |
          vp env exec -- npm ci --prefix .github/release-tools --ignore-scripts --no-audit --no-fund
          vp node --test .github/release-tools/test.cjs

      - name: Run format, lint, and type-check (vp check)
        run: vp check

      - name: Build distribution artifacts before tests (vp pack)
        run: vp pack

      - name: Run unit and DOM test suite against fresh bundles (vp test)
        run: vp test

      - name: Verify bundle syntax and outputs
        run: |
          node --check dist/naka.js
          node --check dist/naka.min.js
          test -f dist/index.mjs
          test -f dist/index.d.mts

      - name: Audit npm package contents
        run: |
          npm pack --ignore-scripts --dry-run --json > "$RUNNER_TEMP/nakajs-pack.json"
          vp node scripts/release.ts package "$RUNNER_TEMP/nakajs-pack.json"

      - name: Stage GitHub Pages site from verified bundles
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          rm -rf _site
          mkdir -p _site/dist
          cp -R site examples _site/
          sed 's#\.\./dist/#./dist/#g' site/index.html > _site/index.html
          cp dist/naka.js dist/naka.min.js _site/dist/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
