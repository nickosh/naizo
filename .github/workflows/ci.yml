name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (check, test, pack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format, lint, and type-check (vp check)
        run: pnpm exec vp check

      - name: Run unit and DOM test suite (vp test)
        run: pnpm exec vp test

      - name: Build distribution artifacts (vp pack)
        run: pnpm exec vp pack

      - name: Verify bundle syntax and dist/naka.js freshness (D17)
        run: |
          node --check dist/naka.js
          node --check dist/naka.min.js
          test -f dist/index.mjs
          test -f dist/index.d.mts
          git diff --exit-code dist/naka.js

      - name: Audit npm package contents
        run: |
          npm pack --ignore-scripts --dry-run --json > "$RUNNER_TEMP/nakajs-pack.json"
          node scripts/release.ts package "$RUNNER_TEMP/nakajs-pack.json"
