name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      pages_source:
        description: 'GitHub Pages source when deploying manually (main or latest release tag vX.Y.Z)'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - latest-release

permissions:
  contents: read

concurrency:
  # Separate Pages-deploying runs on main so ordinary pushes never cancel a queued Pages deploy.
  group: >-
    ${{
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, 'chore(main): release ')) &&
      'ci-refs/heads/main-pages' || format('ci-{0}-verify', github.ref)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (check, test, pack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ (github.event_name == 'workflow_dispatch' && inputs.pages_source == 'latest-release') && '0' || '1' }}
          persist-credentials: false

      - name: Setup pinned Vite+ environment
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: ${{ github.event_name != 'workflow_dispatch' || inputs.pages_source != 'latest-release' }}
          run-install: false

      - name: Select latest release tag for Pages
        if: github.event_name == 'workflow_dispatch' && inputs.pages_source == 'latest-release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run latest-release Pages deployment from the main branch (got ${GITHUB_REF})."
            exit 1
          fi
          RELEASE_TAG=$(vp node scripts/release.ts latest-tag)
          vp node scripts/release.ts tag "$RELEASE_TAG"
          COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$COMMIT" origin/main
          git checkout --detach "$COMMIT"
          vp node scripts/release.ts version "$RELEASE_TAG"
          vp env install
          echo "PAGES_RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "PAGES_RELEASE_COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          echo "Selected latest release ${RELEASE_TAG} (${COMMIT}) for GitHub Pages"

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify isolated release tooling
        if: github.event_name != 'workflow_dispatch' || inputs.pages_source != 'latest-release'
        run: |
          vp env exec -- npm ci --prefix .github/release-tools --ignore-scripts --no-audit --no-fund
          vp node --test .github/release-tools/test.cjs

      - name: Run format, lint, and type-check (vp check)
        run: vp check

      - name: Build distribution artifacts before tests (vp pack)
        run: vp pack

      - name: Run unit and DOM test suite against fresh bundles (vp test)
        run: vp test

      - name: Verify bundle syntax and outputs
        run: |
          node --check dist/naizo.js
          node --check dist/naizo.min.js
          test -f dist/index.mjs
          test -f dist/index.d.mts
          git diff --exit-code dist/naizo.js

      - name: Audit npm package contents
        run: |
          npm pack --ignore-scripts --dry-run --json > "$RUNNER_TEMP/naizo-pack.json"
          vp node scripts/release.ts package "$RUNNER_TEMP/naizo-pack.json"

      - name: Stage GitHub Pages site from verified bundles
        run: |
          rm -rf _site
          mkdir -p _site/dist
          cp -RL site/. _site/
          cp -R examples _site/
          sed -e 's#\.\./dist/#./dist/#g' -e 's#\.\./examples/#./examples/#g' site/index.html > _site/index.html
          cp dist/naizo.js dist/naizo.min.js _site/dist/
          touch _site/.nojekyll

      - name: Record GitHub Pages source summary
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           contains(github.event.head_commit.message, 'chore(main): release '))
        run: |
          if [ -n "${PAGES_RELEASE_TAG:-}" ]; then
            echo "GitHub Pages source: **latest-release** (\`${PAGES_RELEASE_TAG}\` @ \`${PAGES_RELEASE_COMMIT}\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub Pages source: **main** (\`${GITHUB_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'workflow_dispatch' ||
           contains(github.event.head_commit.message, 'chore(main): release '))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, 'chore(main): release '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
