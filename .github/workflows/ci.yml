name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (check, test, pack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pinned Vite+ environment
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Verify isolated release tooling
        run: |
          vp env exec -- npm ci --prefix .github/release-tools --ignore-scripts --no-audit --no-fund
          vp node --test .github/release-tools/test.cjs

      - name: Run format, lint, and type-check (vp check)
        run: vp check

      - name: Build distribution artifacts before tests (vp pack)
        run: vp pack

      - name: Run unit and DOM test suite against fresh bundles (vp test)
        run: vp test

      - name: Verify bundle syntax and outputs
        run: |
          node --check dist/naka.js
          node --check dist/naka.min.js
          test -f dist/index.mjs
          test -f dist/index.d.mts

      - name: Verify the release PR includes its freshly built readable bundle
        if: github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main--components--nakajs' && github.event.pull_request.head.repo.full_name == github.repository
        run: git diff --exit-code -- dist/naka.js

      - name: Audit npm package contents
        run: |
          npm pack --ignore-scripts --dry-run --json > "$RUNNER_TEMP/nakajs-pack.json"
          vp node scripts/release.ts package "$RUNNER_TEMP/nakajs-pack.json"
