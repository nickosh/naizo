<!doctype html>
<html lang="en" naizo-id="naizo-release-checklist">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Checklist — naizo.js Example</title>
    <link
      rel="icon"
      type="image/svg+xml"
      media="(prefers-color-scheme: light)"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%231c1917' stroke-width='8'/%3E%3Crect x='39' y='26' width='22' height='22' rx='4.5' fill='%231c1917'/%3E%3Crect x='26' y='52' width='22' height='22' rx='4.5' fill='%231c1917'/%3E%3Crect x='52' y='52' width='22' height='22' rx='4.5' fill='%231c1917'/%3E%3C/svg%3E"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      media="(prefers-color-scheme: dark)"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23f5f5f4' stroke-width='8'/%3E%3Crect x='39' y='26' width='22' height='22' rx='4.5' fill='%23f5f5f4'/%3E%3Crect x='26' y='52' width='22' height='22' rx='4.5' fill='%23f5f5f4'/%3E%3Crect x='52' y='52' width='22' height='22' rx='4.5' fill='%23f5f5f4'/%3E%3C/svg%3E"
    />

    <!-- 1. Canonical #naizodb JSON state (readable & editable by humans and AI agents) -->
    <script id="naizodb" type="application/json">
      {
        "_meta": {
          "id": "naizo-release-checklist"
        },
        "fields": {
          "checklist_title": "Pre-Release Verification Checklist",
          "reviewer": "Jordan",
          "environment": "Staging",
          "ready_for_release": false,
          "signoff_notes": "All unit and DOM integration checks must pass before tagging."
        },
        "lists": {
          "checks": [
            {
              "done": true,
              "task": "Run format, lint, and type-check suite (vp check)",
              "priority": "High"
            },
            {
              "done": true,
              "task": "Verify automated unit and DOM tests (vp test)",
              "priority": "High"
            },
            {
              "done": false,
              "task": "Smoke-test disk sync and HTML snapshot export in browser",
              "priority": "Med"
            }
          ]
        },
        "custom": {}
      }
    </script>

    <!-- 2. Load naizo.js locally or via CDN:
         <script src="https://cdn.jsdelivr.net/npm/naizojs@latest/dist/naizo.js" defer></script> -->
    <script src="../dist/naizo.js" defer></script>

    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --row-border: #f1f5f9;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #111827;
          --border: #334155;
          --row-border: #1e293b;
          --text: #f8fafc;
          --muted: #94a3b8;
          --accent: #60a5fa;
        }
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 760px;
        margin: 2.5rem auto;
        padding: 0 1.25rem 5.5rem;
        line-height: 1.5;
      }
      h1[contenteditable='true'] {
        margin: 0 0 1.25rem;
        font-size: 1.75rem;
        padding: 4px 8px;
        margin-left: -8px;
        border-radius: 6px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
      }
      .card h2 {
        margin: 0 0 0.75rem;
        font-size: 0.9rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .meta-row {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 1rem;
        align-items: end;
      }
      .meta-row > * {
        min-width: 0;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--muted);
      }
      .ready-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
      }
      input[type='text'],
      select,
      textarea {
        width: 100%;
        min-width: 0;
        max-width: 100%;
        margin-top: 0.25rem;
        padding: 0.5rem 0.65rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        color: var(--text);
        box-sizing: border-box;
      }
      textarea {
        min-height: 72px;
        field-sizing: fixed;
        resize: vertical;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.25rem;
        border-bottom: 1px solid var(--row-border);
      }
      .check-box {
        display: inline-flex;
        align-items: center;
        margin: 0;
        cursor: pointer;
      }
      .check-task {
        flex: 1;
        margin: 0;
      }
      .check-priority {
        width: 110px;
        margin: 0;
      }
      .check-row input[type='text'],
      .check-row select {
        margin-top: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1 contenteditable="true" naizo="checklist_title">Pre-Release Verification Checklist</h1>

    <section class="card">
      <h2>Release Metadata</h2>
      <div class="meta-row">
        <label>
          Reviewer
          <input type="text" naizo="reviewer" value="Jordan" />
        </label>
        <label>
          Target Environment
          <select naizo="environment">
            <option value="Local">Local</option>
            <option value="Staging" selected>Staging</option>
            <option value="Production">Production</option>
          </select>
        </label>
        <label class="ready-toggle">
          <input type="checkbox" naizo="ready_for_release" />
          <span>Ready for Release</span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Verification Items</h2>
      <div naizo-list="checks">
        <template naizo-template>
          <div class="check-row" naizo-item>
            <label class="check-box">
              <input type="checkbox" naizo="done" />
              <span class="sr-only">Done</span>
            </label>
            <label class="check-task">
              <span class="sr-only">Verification item</span>
              <input type="text" naizo="task" placeholder="Add verification step..." />
            </label>
            <label class="check-priority">
              <span class="sr-only">Priority</span>
              <select naizo="priority">
                <option value="">— Priority —</option>
                <option value="High">High</option>
                <option value="Med" selected>Med</option>
                <option value="Low">Low</option>
              </select>
            </label>
          </div>
        </template>
      </div>
    </section>

    <section class="card">
      <h2>Sign-Off Notes</h2>
      <label>
        Notes &amp; Blockers
        <textarea naizo="signoff_notes">
All unit and DOM integration checks must pass before tagging.</textarea>
      </label>
    </section>
  </body>
</html>
