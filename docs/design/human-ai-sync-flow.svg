<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 204" width="920" height="204" role="img" aria-label="How a human in the browser and an AI agent on disk co-edit one single .html file via #naizodb">
  <style>
    .bg-panel {
      fill: #faf8f5;
      stroke: #e5e0d8;
      stroke-width: 1;
    }
    .card {
      fill: #ffffff;
      stroke: #e5e0d8;
      stroke-width: 1;
    }
    .card-accent {
      fill: #ffffff;
      stroke: #10b981;
      stroke-width: 1.5;
    }
    .sub-box {
      fill: #f3efe8;
      stroke: #e5e0d8;
      stroke-width: 1;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #1c1917;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #6b655e;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #334155;
    }
    .flow-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 10px;
      font-weight: 700;
      fill: #1c1917;
    }
    .pill-mini {
      fill: #ffffff;
      fill-opacity: 0.9;
      stroke: #0f172a;
      stroke-opacity: 0.14;
      stroke-width: 1;
    }
    @media (prefers-color-scheme: dark) {
      .bg-panel {
        fill: #141311;
        stroke: #2e2c28;
      }
      .card {
        fill: #1c1917;
        stroke: #2e2c28;
      }
      .card-accent {
        fill: #1c1917;
        stroke: #10b981;
      }
      .sub-box {
        fill: #24211d;
        stroke: #36322d;
      }
      .title, .flow-label {
        fill: #e7e5e4;
      }
      .sub {
        fill: #a6a096;
      }
      .mono {
        fill: #cbd5e1;
      }
      .pill-mini {
        fill: #0f172a;
        fill-opacity: 0.8;
        stroke: #ffffff;
        stroke-opacity: 0.18;
      }
    }

    @keyframes flowDashForward {
      to { stroke-dashoffset: -24; }
    }
    @keyframes flowDashBack {
      to { stroke-dashoffset: 24; }
    }
    .flow-line-fwd {
      stroke-dasharray: 6 6;
      animation: flowDashForward 1.1s linear infinite;
    }
    .flow-line-back {
      stroke-dasharray: 6 6;
      animation: flowDashBack 1.1s linear infinite;
    }

    .ring,
    .c-top,
    .c-bl,
    .c-br {
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes naizoHeartTop {
      0%, 29%, 100% { transform: translate(0, 0) scale(1); }
      11.5% { transform: translate(0, -1.4px) scale(1.22); }
    }
    @keyframes naizoHeartBR {
      0%, 33.33%, 62.33%, 100% { transform: translate(0, 0) scale(1); }
      44.83% { transform: translate(1.1px, 1.1px) scale(1.22); }
    }
    @keyframes naizoHeartBL {
      0%, 66.67%, 95.67%, 100% { transform: translate(0, 0) scale(1); }
      78.17% { transform: translate(-1.1px, 1.1px) scale(1.22); }
    }
    @keyframes naizoRingBreath {
      0%, 6%, 33.33%, 39.33%, 66.67%, 72.67%, 100% { transform: scale(1); }
      18.5%, 51.83%, 85.17% { transform: scale(1.064); }
    }
    .anim-saving .ring { animation: naizoRingBreath 1.55s ease-out infinite; }
    .anim-saving .c-top { animation: naizoHeartTop 1.55s ease-in-out infinite; }
    .anim-saving .c-br { animation: naizoHeartBR 1.55s ease-in-out infinite; }
    .anim-saving .c-bl { animation: naizoHeartBL 1.55s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .flow-line-fwd, .flow-line-back, .ring, .c-top, .c-bl, .c-br {
        animation: none !important;
      }
    }
  </style>

  <rect class="bg-panel" x="0.5" y="0.5" width="919" height="203" rx="12" />

  <!-- 1. LEFT CARD: HUMAN IN BROWSER (x = 16..218) -->
  <g transform="translate(16, 20)">
    <rect class="card" x="0" y="0" width="202" height="164" rx="10" />
    <!-- Browser window dots -->
    <circle cx="14" cy="14" r="3.2" fill="#ef4444" fill-opacity="0.7" />
    <circle cx="24" cy="14" r="3.2" fill="#f59e0b" fill-opacity="0.7" />
    <circle cx="34" cy="14" r="3.2" fill="#10b981" fill-opacity="0.7" />
    <text class="title" x="114" y="18" text-anchor="middle">1. Human in Browser</text>
    <line x1="0" y1="28" x2="202" y2="28" stroke="#e5e0d8" stroke-opacity="0.5" />

    <!-- Mini UI preview rows -->
    <rect class="sub-box" x="12" y="36" width="178" height="22" rx="5" />
    <text class="mono" x="20" y="51">Title: "Launch Plan"</text>

    <rect class="sub-box" x="12" y="64" width="178" height="22" rx="5" />
    <rect x="20" y="70" width="10" height="10" rx="2" fill="#10b981" />
    <polyline points="22 75 24.5 77.5 28.5 72.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <text class="sub" x="36" y="79">Draft specification</text>

    <!-- Dedicated Status Pill row (y = 94..120) -->
    <text class="sub" x="12" y="111">Status Pill:</text>
    <g transform="translate(94, 94)">
      <rect class="pill-mini" x="0" y="0" width="96" height="26" rx="13" />
      <g class="anim-saving" transform="translate(6, 4) scale(0.18)">
        <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" />
        <rect class="c-top" x="41" y="28" width="18" height="18" rx="4" fill="#10b981" />
        <rect class="c-bl" x="28" y="54" width="18" height="18" rx="4" fill="#10b981" />
        <rect class="c-br" x="54" y="54" width="18" height="18" rx="4" fill="#10b981" />
      </g>
      <text class="mono" x="28" y="16" fill="#10b981">⌘S · Synced</text>
    </g>

    <!-- Separated footer caption (y = 128..156) -->
    <line x1="12" y1="128" x2="190" y2="128" stroke="#e5e0d8" stroke-opacity="0.5" />
    <text class="sub" x="101" y="147" text-anchor="middle" fill="#10b981">Edits UI · Instant cache + disk save</text>
  </g>

  <!-- 2. CENTER CARD: SINGLE .HTML FILE ON DISK (x = 358..562) -->
  <g transform="translate(358, 16)">
    <rect class="card-accent" x="0" y="0" width="204" height="172" rx="10" />
    <g transform="translate(14, 9) scale(0.2)">
      <circle cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" />
      <rect x="39" y="26" width="22" height="22" rx="4.5" fill="#10b981" />
      <rect x="26" y="52" width="22" height="22" rx="4.5" fill="#10b981" />
      <rect x="52" y="52" width="22" height="22" rx="4.5" fill="#10b981" />
    </g>
    <text class="title" x="40" y="24">2. Single .html File</text>
    <line x1="0" y1="36" x2="204" y2="36" stroke="#e5e0d8" stroke-opacity="0.5" />

    <!-- <head> #naizodb block -->
    <rect class="sub-box" x="12" y="46" width="180" height="58" rx="6" />
    <text class="mono" x="20" y="63" fill="#10b981">&lt;script id="naizodb"&gt;</text>
    <text class="sub" x="20" y="79">Built-in JSON data (内蔵):</text>
    <text class="mono" x="20" y="95">{ fields, lists, custom }</text>

    <!-- <body> template block -->
    <rect class="sub-box" x="12" y="112" width="180" height="48" rx="6" />
    <text class="mono" x="20" y="130">&lt;body&gt; HTML Template</text>
    <text class="sub" x="20" y="148">naizo="key" · naizo-list</text>
  </g>

  <!-- 3. RIGHT CARD: AI AGENT / EDITOR ON DISK (x = 702..904) -->
  <g transform="translate(702, 20)">
    <rect class="card" x="0" y="0" width="202" height="164" rx="10" />
    <text class="title" x="101" y="18" text-anchor="middle">3. AI Agent / Editor</text>
    <line x1="0" y1="28" x2="202" y2="28" stroke="#e5e0d8" stroke-opacity="0.5" />

    <rect class="sub-box" x="12" y="38" width="178" height="68" rx="6" />
    <text class="mono" x="20" y="56">$ agent update plan.html</text>
    <text class="sub" x="20" y="74">+ Reads human edits from</text>
    <text class="mono" x="20" y="92">&lt;script id="naizodb"&gt;</text>

    <text class="sub" x="101" y="128" text-anchor="middle">Claude Code · Cursor · Codex</text>
    <text class="sub" x="101" y="146" text-anchor="middle">Antigravity · Gemini CLI</text>
  </g>

  <!-- FLOW ARROWS: LEFT <-> CENTER (140px gap: x = 218..358, center = 288) -->
  <g>
    <text class="flow-label" x="288" y="48" text-anchor="middle" fill="#10b981">Saves #naizodb</text>
    <text class="sub" x="288" y="61" text-anchor="middle">Status Pill / ⌘S</text>
    <line class="flow-line-fwd" x1="228" y1="73" x2="342" y2="73" stroke="#10b981" stroke-width="2" />
    <polygon points="348,73 339,68 339,78" fill="#10b981" />

    <line class="flow-line-back" x1="234" y1="127" x2="348" y2="127" stroke="#f59e0b" stroke-width="2" />
    <polygon points="228,127 237,122 237,132" fill="#f59e0b" />
    <text class="flow-label" x="288" y="145" text-anchor="middle" fill="#d97706">Auto-syncs (~2 s)</text>
    <text class="sub" x="288" y="158" text-anchor="middle">Safe live merge</text>
  </g>

  <!-- FLOW ARROWS: CENTER <-> RIGHT (140px gap: x = 562..702, center = 632) -->
  <g>
    <text class="flow-label" x="632" y="48" text-anchor="middle" fill="#10b981">Reads #naizodb</text>
    <text class="sub" x="632" y="61" text-anchor="middle">Clean JSON state</text>
    <line class="flow-line-fwd" x1="572" y1="73" x2="686" y2="73" stroke="#10b981" stroke-width="2" />
    <polygon points="692,73 683,68 683,78" fill="#10b981" />

    <line class="flow-line-back" x1="578" y1="127" x2="692" y2="127" stroke="#f59e0b" stroke-width="2" />
    <polygon points="572,127 581,122 581,132" fill="#f59e0b" />
    <text class="flow-label" x="632" y="145" text-anchor="middle" fill="#d97706">Edits #naizodb</text>
    <text class="sub" x="632" y="158" text-anchor="middle">Directly on disk</text>
  </g>
</svg>
