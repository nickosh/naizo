<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 148" width="920" height="148" role="img" aria-label="naizo.js Status Pill live crest and network globe animations">
  <defs>
    <clipPath id="net-wave-clip">
      <rect class="wave-band-rect" x="-4" y="0" width="9" height="24" rx="4" />
    </clipPath>
  </defs>
  <style>
    .bg-panel {
      fill: #faf8f5;
      stroke: #e5e0d8;
      stroke-width: 1;
    }
    .card {
      fill: #ffffff;
      stroke: #e5e0d8;
      stroke-width: 1;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      fill: #1c1917;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #6b655e;
    }
    .badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 9.5px;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      .bg-panel {
        fill: #141311;
        stroke: #2e2c28;
      }
      .card {
        fill: #1c1917;
        stroke: #2e2c28;
      }
      .title {
        fill: #e7e5e4;
      }
      .sub {
        fill: #a6a096;
      }
    }

    .ring { transform-origin: 50px 50px; }
    .c-top { transform-origin: 50px 37px; }
    .c-bl { transform-origin: 37px 63px; }
    .c-br { transform-origin: 63px 63px; }

    /* 1. Boot-Up Seal (1.2s loop with pause for showcase) */
    @keyframes naizoBootRingLoop {
      0%, 8% { stroke-dasharray: 263.89; stroke-dashoffset: 263.89; transform: scale(0.92); opacity: 0.3; }
      45% { stroke-dasharray: 263.89; stroke-dashoffset: 0; transform: scale(1.03); opacity: 1; }
      65%, 100% { stroke-dasharray: 263.89; stroke-dashoffset: 0; transform: scale(1); opacity: 1; }
    }
    @keyframes naizoBootTopLoop {
      0%, 14% { transform: translate(0px, 13px) scale(0); opacity: 0; }
      50% { transform: translate(0px, -1.5px) scale(1.05); opacity: 1; }
      68%, 100% { transform: translate(0px, 0px) scale(1); opacity: 1; }
    }
    @keyframes naizoBootBLLoop {
      0%, 22% { transform: translate(13px, -13px) scale(0); opacity: 0; }
      56% { transform: translate(-1.2px, 1.2px) scale(1.05); opacity: 1; }
      72%, 100% { transform: translate(0px, 0px) scale(1); opacity: 1; }
    }
    @keyframes naizoBootBRLoop {
      0%, 30% { transform: translate(-13px, -13px) scale(0); opacity: 0; }
      62% { transform: translate(1.2px, 1.2px) scale(1.05); opacity: 1; }
      76%, 100% { transform: translate(0px, 0px) scale(1); opacity: 1; }
    }
    .anim-boot .ring { animation: naizoBootRingLoop 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-boot .c-top { animation: naizoBootTopLoop 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .anim-boot .c-bl { animation: naizoBootBLLoop 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
    .anim-boot .c-br { animation: naizoBootBRLoop 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }

    /* 2. Saving: Seamless Clockwise Heartbeat 1-2-3 Wave with +105ms Concentric Ring Push (1.55s) */
    @keyframes naizoHeartTop {
      0%, 29%, 100% { transform: translate(0, 0) scale(1); }
      11.5% { transform: translate(0, -1.4px) scale(1.22); }
    }
    @keyframes naizoHeartBR {
      0%, 33.33%, 62.33%, 100% { transform: translate(0, 0) scale(1); }
      44.83% { transform: translate(1.1px, 1.1px) scale(1.22); }
    }
    @keyframes naizoHeartBL {
      0%, 66.67%, 95.67%, 100% { transform: translate(0, 0) scale(1); }
      78.17% { transform: translate(-1.1px, 1.1px) scale(1.22); }
    }
    @keyframes naizoRingBreath {
      0%, 6%, 33.33%, 39.33%, 66.67%, 72.67%, 100% { transform: scale(1); }
      18.5%, 51.83%, 85.17% { transform: scale(1.064); }
    }
    .anim-saving .ring { animation: naizoRingBreath 1.55s ease-out infinite; }
    .anim-saving .c-top { animation: naizoHeartTop 1.55s ease-in-out infinite; }
    .anim-saving .c-br { animation: naizoHeartBR 1.55s ease-in-out infinite; }
    .anim-saving .c-bl { animation: naizoHeartBL 1.55s ease-in-out infinite; }

    /* 3. Conflict Clash — Spring Squash (1.75s) */
    @keyframes naizoConflictBL {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-2.5px, 0) scale(0.97, 1.02); }
      38%, 41% { transform: translate(1.4px, 0) scale(1.04, 0.95); }
      54% { transform: translate(-0.7px, 0) scale(1); }
      74% { transform: translate(0, 0) scale(1); }
    }
    @keyframes naizoConflictBR {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(2.5px, 0) scale(0.97, 1.02); }
      38%, 41% { transform: translate(-1.4px, 0) scale(1.04, 0.95); }
      54% { transform: translate(0.7px, 0) scale(1); }
      74% { transform: translate(0, 0) scale(1); }
    }
    @keyframes naizoConflictTop {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25%, 37% { transform: translate(0, 1.6px) scale(1.02, 0.97); }
      41.5% { transform: translate(0, 2.2px) scale(1.05, 0.92); }
      54% { transform: translate(0, -5.8px) scale(0.96, 1.06); }
      80% { transform: translate(0, 0) scale(1); }
    }
    @keyframes naizoConflictRing {
      0%, 40%, 100% { transform: scale(1); }
      50% { transform: scale(1.055); }
      76% { transform: scale(1); }
    }
    .anim-conflict .ring { animation: naizoConflictRing 1.75s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-conflict .c-top { animation: naizoConflictTop 1.75s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-conflict .c-bl { animation: naizoConflictBL 1.75s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .anim-conflict .c-br { animation: naizoConflictBR 1.75s cubic-bezier(0.22, 1, 0.36, 1) infinite; }

    /* 4. Needs Permission: Clockwise Wave Pulse (1.75s) */
    @keyframes naizoWaveRing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes naizoWaveTop {
      0%, 65%, 100% { transform: translate(0, 0) scale(1); }
      22% { transform: translate(0, -5.5px) scale(1.04); }
    }
    @keyframes naizoWaveBR {
      0%, 14%, 79%, 100% { transform: translate(0, 0) scale(1); }
      36% { transform: translate(2px, 2px) scale(1.04); }
    }
    @keyframes naizoWaveBL {
      0%, 28%, 92%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-2px, 2px) scale(1.04); }
    }
    .anim-wave .ring { animation: naizoWaveRing 1.75s ease-in-out infinite; }
    .anim-wave .c-top { animation: naizoWaveTop 1.75s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }
    .anim-wave .c-br { animation: naizoWaveBR 1.75s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }
    .anim-wave .c-bl { animation: naizoWaveBL 1.75s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }

    /* 5. Error: Sync Pulse (1.6s) */
    @keyframes naizoSyncRing {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(0.97); }
      52% { transform: scale(1.06); }
      85% { transform: scale(1); }
    }
    @keyframes naizoSyncTop {
      0%, 100% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(0, 2.2px) scale(0.93); }
      50% { transform: translate(0, -5.5px) scale(1.04); }
    }
    @keyframes naizoSyncBL {
      0%, 100% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(2px, -2px) scale(0.93); }
      50% { transform: translate(-2px, 2px) scale(1.04); }
    }
    @keyframes naizoSyncBR {
      0%, 100% { transform: translate(0, 0) scale(1); }
      20% { transform: translate(-2px, -2px) scale(0.93); }
      50% { transform: translate(2px, 2px) scale(1.04); }
    }
    .anim-error .ring { animation: naizoSyncRing 1.6s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }
    .anim-error .c-top { animation: naizoSyncTop 1.6s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }
    .anim-error .c-bl { animation: naizoSyncBL 1.6s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }
    .anim-error .c-br { animation: naizoSyncBR 1.6s cubic-bezier(0.34, 1.4, 0.64, 1) infinite; }

    /* 6. #net Active Wave & Error Pulse */
    @keyframes naizoGlobeWaveBand {
      0% { transform: translateX(-11px); }
      56% { transform: translateX(25px); }
      56.01%, 100% { transform: translateX(-11px); }
    }
    .wave-band-rect {
      animation: naizoGlobeWaveBand 1.65s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes naizoGlobeErrorPulse {
      0%, 100% { transform: scale(1); opacity: 0.72; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .anim-net-error {
      transform-origin: 12px 12px;
      animation: naizoGlobeErrorPulse 1.5s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .ring, .c-top, .c-bl, .c-br, .wave-band-rect, .anim-net-error {
        animation: none !important;
      }
    }
  </style>

  <rect class="bg-panel" x="0.5" y="0.5" width="919" height="147" rx="12" />

  <!-- Card 1: Synced / Saved (Static Green) -->
  <g transform="translate(10, 10)">
    <rect class="card" x="0" y="0" width="122" height="128" rx="9" />
    <svg x="41" y="14" width="40" height="40" viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" />
      <rect class="c-top" x="41" y="28" width="18" height="18" rx="4" fill="#10b981" />
      <rect class="c-bl" x="28" y="54" width="18" height="18" rx="4" fill="#10b981" />
      <rect class="c-br" x="54" y="54" width="18" height="18" rx="4" fill="#10b981" />
    </svg>
    <text class="title" x="61" y="74" text-anchor="middle">Synced / Saved</text>
    <text class="sub" x="61" y="91" text-anchor="middle">Calm at rest</text>
    <text class="badge" x="61" y="111" fill="#10b981" text-anchor="middle">Green · Static</text>
  </g>

  <!-- Card 2: Saving... (Live Heartbeat) -->
  <g transform="translate(140, 10)">
    <rect class="card" x="0" y="0" width="122" height="128" rx="9" />
    <svg class="anim-saving" x="41" y="14" width="40" height="40" viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" />
      <rect class="c-top" x="41" y="28" width="18" height="18" rx="4" fill="#10b981" />
      <rect class="c-bl" x="28" y="54" width="18" height="18" rx="4" fill="#10b981" />
      <rect class="c-br" x="54" y="54" width="18" height="18" rx="4" fill="#10b981" />
    </svg>
    <text class="title" x="61" y="74" text-anchor="middle">Saving...</text>
    <text class="sub" x="61" y="91" text-anchor="middle">3-beat ring push</text>
    <text class="badge" x="61" y="111" fill="#10b981" text-anchor="middle">Heartbeat · 1.55s</text>
  </g>

  <!-- Card 3: Browser Cache (Static Amber) -->
  <g transform="translate(270, 10)">
    <rect class="card" x="0" y="0" width="122" height="128" rx="9" />
    <svg x="41" y="14" width="40" height="40" viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#f59e0b" stroke-width="8" />
      <rect class="c-top" x="41" y="28" width="18" height="18" rx="4" fill="#f59e0b" />
      <rect class="c-bl" x="28" y="54" width="18" height="18" rx="4" fill="#f59e0b" />
      <rect class="c-br" x="54" y="54" width="18" height="18" rx="4" fill="#f59e0b" />
    </svg>
    <text class="title" x="61" y="74" text-anchor="middle">Browser Cache</text>
    <text class="sub" x="61" y="91" text-anchor="middle">Ready to link file</text>
    <text class="badge" x="61" y="111" fill="#d97706" text-anchor="middle">Amber · Static</text>
  </g>

  <!-- Card 4: Resume Disk Sync (Live Wave Pulse) -->
  <g transform="translate(400, 10)">
    <rect class="card" x="0" y="0" width="122" height="128" rx="9" />
    <svg class="anim-wave" x="41" y="14" width="40" height="40" viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#f59e0b" stroke-width="8" />
      <rect class="c-top" x="41" y="28" width="18" height="18" rx="4" fill="#f59e0b" />
      <rect class="c-bl" x="28" y="54" width="18" height="18" rx="4" fill="#f59e0b" />
      <rect class="c-br" x="54" y="54" width="18" height="18" rx="4" fill="#f59e0b" />
    </svg>
    <text class="title" x="61" y="74" text-anchor="middle">Resume Sync</text>
    <text class="sub" x="61" y="91" text-anchor="middle">Needs 1-click allow</text>
    <text class="badge" x="61" y="111" fill="#d97706" text-anchor="middle">Wave Pulse · 1.75s</text>
  </g>

  <!-- Card 5: Conflict Backed Up (Live Conflict Clash) -->
  <g transform="translate(530, 10)">
    <rect class="card" x="0" y="0" width="122" height="128" rx="9" />
    <svg class="anim-conflict" x="41" y="14" width="40" height="40" viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#f59e0b" stroke-width="8" />
      <rect class="c-top" x="41" y="28" width="18" height="18" rx="4" fill="#f59e0b" />
      <rect class="c-bl" x="28" y="54" width="18" height="18" rx="4" fill="#f59e0b" />
      <rect class="c-br" x="54" y="54" width="18" height="18" rx="4" fill="#f59e0b" />
    </svg>
    <text class="title" x="61" y="74" text-anchor="middle">Conflict</text>
    <text class="sub" x="61" y="91" text-anchor="middle">Backup ready</text>
    <text class="badge" x="61" y="111" fill="#d97706" text-anchor="middle">Clash &amp; Pop · 1.75s</text>
  </g>

  <!-- Card 6: Invalid JSON (Live Error Sync Pulse) -->
  <g transform="translate(660, 10)">
    <rect class="card" x="0" y="0" width="122" height="128" rx="9" />
    <svg class="anim-error" x="41" y="14" width="40" height="40" viewBox="0 0 100 100">
      <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#ef4444" stroke-width="8" />
      <rect class="c-top" x="41" y="28" width="18" height="18" rx="4" fill="#ef4444" />
      <rect class="c-bl" x="28" y="54" width="18" height="18" rx="4" fill="#ef4444" />
      <rect class="c-br" x="54" y="54" width="18" height="18" rx="4" fill="#ef4444" />
    </svg>
    <text class="title" x="61" y="74" text-anchor="middle">Invalid JSON</text>
    <text class="sub" x="61" y="91" text-anchor="middle">Click Repair JSON</text>
    <text class="badge" x="61" y="111" fill="#ef4444" text-anchor="middle">Sync Pulse · 1.6s</text>
  </g>

  <!-- Card 7: #net Wired Globe (Live L->R Wave + Red Pulse) -->
  <g transform="translate(790, 10)">
    <rect class="card" x="0" y="0" width="120" height="128" rx="9" />
    <!-- Active Globe (left) -->
    <svg x="22" y="18" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#10b981" stroke-opacity="0.38" stroke-width="1.85">
        <path d="M 3.6 8.2 Q 12 9.7 20.4 8.2" />
        <path d="M 3.6 15.8 Q 12 14.3 20.4 15.8" />
        <ellipse cx="12" cy="12" rx="4.6" ry="9.5" />
        <circle cx="12" cy="12" r="9.5" />
      </g>
      <g stroke="#10b981" stroke-width="1.85" clip-path="url(#net-wave-clip)">
        <path d="M 3.6 8.2 Q 12 9.7 20.4 8.2" />
        <path d="M 3.6 15.8 Q 12 14.3 20.4 15.8" />
        <ellipse cx="12" cy="12" rx="4.6" ry="9.5" />
        <circle cx="12" cy="12" r="9.5" />
      </g>
    </svg>
    <!-- Error Globe (right) -->
    <svg x="66" y="18" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
      <g class="anim-net-error">
        <path d="M 3.6 8.2 Q 12 9.7 20.4 8.2" />
        <path d="M 3.6 15.8 Q 12 14.3 20.4 15.8" />
        <ellipse cx="12" cy="12" rx="4.6" ry="9.5" />
        <circle cx="12" cy="12" r="9.5" />
      </g>
    </svg>
    <text class="title" x="60" y="74" text-anchor="middle">Network Globe</text>
    <text class="sub" x="60" y="91" text-anchor="middle">Active &amp; Error</text>
    <text class="badge" x="60" y="111" fill="#10b981" text-anchor="middle">L→R Wave / Pulse</text>
  </g>
</svg>
