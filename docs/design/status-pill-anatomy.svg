<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 186" width="920" height="186" role="img" aria-label="Visual anatomy of the naizo.js Status Pill: Maru ni Mitsuishi crest, 1 to 6 action buttons, rightmost #net network globe, and 4-corner snap drag">
  <defs>
    <linearGradient id="pill-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.46" />
    </linearGradient>
    <filter id="pill-elev" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>
  <style>
    .bg-panel {
      fill: #faf8f5;
      stroke: #e5e0d8;
      stroke-width: 1;
    }
    .card {
      fill: #ffffff;
      stroke: #e5e0d8;
      stroke-width: 1;
    }
    .pill-shell {
      fill: url(#pill-glass);
      stroke: #0f172a;
      stroke-opacity: 0.1;
      stroke-width: 1;
      filter: url(#pill-elev);
    }
    .btn-circle {
      fill: #0f172a;
      fill-opacity: 0.055;
      stroke: #0f172a;
      stroke-opacity: 0.14;
      stroke-width: 1.2;
    }
    .btn-icon {
      stroke: #334155;
      stroke-width: 2.05;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #1c1917;
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      fill: #1c1917;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      fill: #6b655e;
    }
    .leader {
      stroke: #94a3b8;
      stroke-width: 1;
      stroke-dasharray: 2 2;
    }
    .viewport-box {
      fill: #f3efe8;
      stroke: #d6d0c4;
      stroke-width: 1;
    }
    .drop-zone {
      fill: #ffffff;
      fill-opacity: 0.6;
      stroke: #64748b;
      stroke-opacity: 0.45;
      stroke-width: 1;
      stroke-dasharray: 3 2;
    }
    .drop-zone-active {
      fill: #10b981;
      fill-opacity: 0.16;
      stroke: #10b981;
      stroke-width: 1.4;
    }
    @media (prefers-color-scheme: dark) {
      .bg-panel {
        fill: #141311;
        stroke: #2e2c28;
      }
      .card {
        fill: #1c1917;
        stroke: #2e2c28;
      }
      .pill-shell {
        fill: #1e293b;
        fill-opacity: 0.75;
        stroke: #ffffff;
        stroke-opacity: 0.14;
      }
      .btn-circle {
        fill: #ffffff;
        fill-opacity: 0.08;
        stroke: #ffffff;
        stroke-opacity: 0.18;
      }
      .btn-icon {
        stroke: #e2e8f0;
      }
      .title, .label {
        fill: #e7e5e4;
      }
      .sub {
        fill: #a6a096;
      }
      .viewport-box {
        fill: #141311;
        stroke: #2e2c28;
      }
      .drop-zone {
        fill: #ffffff;
        fill-opacity: 0.07;
        stroke: #ffffff;
        stroke-opacity: 0.28;
      }
    }
  </style>

  <rect class="bg-panel" x="0.5" y="0.5" width="919" height="185" rx="12" />

  <!-- LEFT PANEL: ANATOMY OF THE FROSTED-GLASS STATUS PILL (1..6 ORDER) -->
  <g transform="translate(12, 12)">
    <rect class="card" x="0" y="0" width="664" height="162" rx="10" />
    <text class="title" x="18" y="22">Status Pill Anatomy — Strict Left-to-Right Slot Order (Hover Any Icon for Label)</text>

    <!-- Frosted Pill Bar Centered at y=58 -->
    <rect class="pill-shell" x="22" y="38" width="620" height="48" rx="24" />

    <!-- Slot 0: #dot Crest (x=54, y=62) -->
    <g transform="translate(36, 44)">
      <svg width="36" height="36" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#10b981" stroke-width="8" />
        <rect x="41" y="28" width="18" height="18" rx="4" fill="#10b981" />
        <rect x="28" y="54" width="18" height="18" rx="4" fill="#10b981" />
        <rect x="54" y="54" width="18" height="18" rx="4" fill="#10b981" />
      </svg>
    </g>
    <line class="leader" x1="54" y1="88" x2="54" y2="108" />
    <text class="label" x="54" y="122" text-anchor="middle" fill="#10b981">Crest (#dot)</text>
    <text class="sub" x="54" y="136" text-anchor="middle">Status &amp; Drag</text>

    <!-- Divider -->
    <line x1="86" y1="49" x2="86" y2="75" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Slot 1: Link / Unlink Disk (x=126) -->
    <g transform="translate(106, 43)">
      <circle class="btn-circle" cx="19" cy="19" r="18" />
      <g class="btn-icon" transform="translate(7, 7) scale(1)">
        <path d="M9 17H7A5 5 0 0 1 7 7h2" />
        <path d="M15 7h2a5 5 0 1 1 0 10h-2" />
        <line x1="8" y1="12" x2="16" y2="12" />
      </g>
    </g>
    <line class="leader" x1="125" y1="88" x2="125" y2="108" />
    <text class="label" x="125" y="122" text-anchor="middle">1. Link / Unlink</text>
    <text class="sub" x="125" y="136" text-anchor="middle">Local file (⌘S)</text>

    <!-- Slot 2: Save to PC (x=204) -->
    <g transform="translate(185, 43)">
      <circle class="btn-circle" cx="19" cy="19" r="18" />
      <g class="btn-icon" transform="translate(7, 7)">
        <path d="M21 15v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="4" />
      </g>
    </g>
    <line class="leader" x1="204" y1="88" x2="204" y2="108" />
    <text class="label" x="204" y="122" text-anchor="middle">2. Save to PC</text>
    <text class="sub" x="204" y="136" text-anchor="middle">Online download</text>

    <!-- Slot 3: Copy JSON (x=283) -->
    <g transform="translate(264, 43)">
      <circle class="btn-circle" cx="19" cy="19" r="18" />
      <g class="btn-icon" transform="translate(7, 7)">
        <rect x="8" y="8" width="13" height="13" rx="2.5" />
        <path d="M5 16H4.5A1.5 1.5 0 0 1 3 14.5v-10A1.5 1.5 0 0 1 4.5 3h10A1.5 1.5 0 0 1 16 4.5V5" />
      </g>
    </g>
    <line class="leader" x1="283" y1="88" x2="283" y2="108" />
    <text class="label" x="283" y="122" text-anchor="middle">3. Copy JSON</text>
    <text class="sub" x="283" y="136" text-anchor="middle">→ ✓ Copied (1.5s)</text>

    <!-- Slot 4: Repair JSON (x=362) -->
    <g transform="translate(343, 43)">
      <circle cx="19" cy="19" r="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" />
      <g transform="translate(7, 7)" stroke="#d97706" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </g>
    </g>
    <line class="leader" x1="362" y1="88" x2="362" y2="108" />
    <text class="label" x="362" y="122" text-anchor="middle" fill="#d97706">4. Repair JSON</text>
    <text class="sub" x="362" y="136" text-anchor="middle">Fixes broken JSON</text>

    <!-- Slot 5: Restore Backup (x=441) -->
    <g transform="translate(422, 43)">
      <circle cx="19" cy="19" r="18" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.2" />
      <g transform="translate(7, 7)" stroke="#d97706" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
        <path d="M12 7v5l3.5 2" />
      </g>
    </g>
    <line class="leader" x1="441" y1="88" x2="441" y2="108" />
    <text class="label" x="441" y="122" text-anchor="middle" fill="#d97706">5. Restore Backup</text>
    <text class="sub" x="441" y="136" text-anchor="middle">1-click undo</text>

    <!-- Slot 6: Reset (Always Last Action Button, x=520) -->
    <g transform="translate(501, 43)">
      <circle cx="19" cy="19" r="18" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.35" stroke-width="1.2" />
      <g transform="translate(7, 7)" stroke="#ef4444" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="m7 20-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 20" />
        <path d="M21 20H7" />
        <path d="m5 11 9 9" />
      </g>
    </g>
    <line class="leader" x1="520" y1="88" x2="520" y2="108" />
    <text class="label" x="520" y="122" text-anchor="middle" fill="#ef4444">6. Reset (Last)</text>
    <text class="sub" x="520" y="136" text-anchor="middle">Initial baseline</text>

    <!-- Divider before #net -->
    <line x1="560" y1="49" x2="560" y2="75" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Rightmost Slot: #net Wired Globe (x=600) -->
    <g transform="translate(584, 46)" stroke="#10b981" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g transform="scale(1.333)">
        <path d="M 3.6 8.2 Q 12 9.7 20.4 8.2" />
        <path d="M 3.6 15.8 Q 12 14.3 20.4 15.8" />
        <ellipse cx="12" cy="12" rx="4.6" ry="9.5" />
        <circle cx="12" cy="12" r="9.5" />
      </g>
    </g>
    <line class="leader" x1="600" y1="88" x2="600" y2="108" />
    <text class="label" x="600" y="122" text-anchor="middle" fill="#10b981">Network (#net)</text>
    <text class="sub" x="600" y="136" text-anchor="middle">Auto-shows on API</text>
  </g>

  <!-- RIGHT PANEL: 4-CORNER SNAP DRAG PREVIEW -->
  <g transform="translate(686, 12)">
    <rect class="card" x="0" y="0" width="222" height="162" rx="10" />
    <text class="title" x="111" y="22" text-anchor="middle">4-Corner Snap Drag</text>

    <rect class="viewport-box" x="16" y="34" width="190" height="90" rx="8" />
    <!-- Top-Left Drop Zone (Active Target) -->
    <rect class="drop-zone-active" x="24" y="42" width="54" height="16" rx="8" />
    <!-- Top-Right Drop Zone -->
    <rect class="drop-zone" x="144" y="42" width="54" height="16" rx="8" />
    <!-- Bottom-Left Drop Zone -->
    <rect class="drop-zone" x="24" y="100" width="54" height="16" rx="8" />
    <!-- Bottom-Right Drop Zone -->
    <rect class="drop-zone" x="144" y="100" width="54" height="16" rx="8" />

    <!-- Drag path curve from BR to TL -->
    <path d="M 166 108 Q 111 82 56 52" fill="none" stroke="#10b981" stroke-width="1.6" stroke-dasharray="3 3" />
    <polygon points="52,50 61,50 57,57" fill="#10b981" />

    <text class="sub" x="111" y="140" text-anchor="middle">Drag crest to any corner —</text>
    <text class="sub" x="111" y="153" text-anchor="middle">remembered automatically</text>
  </g>
</svg>
