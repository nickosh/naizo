<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="naizo.js logo">
  <style>
    :root {
      color-scheme: light dark;
    }
    .ring {
      stroke: #1c1917;
    }
    .stone {
      fill: #1c1917;
    }
    @media (prefers-color-scheme: dark) {
      .ring {
        stroke: #f5f5f4;
      }
      .stone {
        fill: #f5f5f4;
      }
    }
  </style>
  <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="#1c1917" stroke-width="8" />
  <rect class="stone" x="39" y="26" width="22" height="22" rx="4.5" fill="#1c1917" />
  <rect class="stone" x="26" y="52" width="22" height="22" rx="4.5" fill="#1c1917" />
  <rect class="stone" x="52" y="52" width="22" height="22" rx="4.5" fill="#1c1917" />
</svg>
